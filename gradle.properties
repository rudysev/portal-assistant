# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Run detekt in its own process (Worker API, process isolation). In the daemon, its type resolution keeps reading a
# rebuilt classes jar from the first run, so the unit-test detekt tasks analysed tests against stale main classes and
# only warned ("compiler errors found during analysis") while check passed.
detekt.use.worker.api=true
