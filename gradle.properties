# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Reuse task outputs (as portal-commons does) and the configured task graph across builds.
org.gradle.caching=true
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Run detekt in its own process (Worker API, process isolation). In the daemon, its type resolution keeps reading a
# rebuilt classes jar from the first run, so the unit-test detekt tasks analysed tests against stale main classes and
# only warned ("compiler errors found during analysis") while check passed.
detekt.use.worker.api=true
# Dependency Analysis 3.19.2 (latest) warns on every configure that it's only verified up to AGP 9.3.1; buildHealth
# runs clean on 9.4.1 here. DEBUG keeps the check visible under --debug. Back to the default (WARN) once a release
# covers our AGP.
dependency.analysis.compatibility=DEBUG
