name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [portal-commons-green]

jobs:
  # Lints every shell script (*.sh, *.command, .githooks/*) with the runner's preinstalled shellcheck and the
  # repo's .shellcheckrc, the same check .githooks/pre-commit runs on staged files.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --version
      - run: git ls-files -z '*.sh' '*.command' '.githooks/*' | xargs -0 --no-run-if-empty shellcheck

  # Dependency advice (unused, undeclared-but-used and wrongly-configured dependencies). Kept out of `check` and the
  # hooks because the advice changes rarely and the analysis is slow, so this separate job is the alarm.
  build-health:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-assistant
    steps:
      - uses: actions/checkout@v7
        with:
          path: portal-assistant
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/portal-commons
          ref: main
          path: portal-commons
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew buildHealth

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-assistant
    steps:
      # settings.gradle.kts does includeBuild("../portal-commons"), so commons is checked out as a sibling.
      - uses: actions/checkout@v7
        with:
          path: portal-assistant
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/portal-commons
          ref: main
          path: portal-commons
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check assembleDebug
